<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
      <span id="theme-label">OSCURO</span><span class="switch"></span>
    </button>
    <h1 class="title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">

          <!-- Pause menu content -->
          <div id="pause-content" class="overlay-content hidden">
            <p class="overlay-heading">PAUSA</p>
            <button id="resume-btn" class="menu-btn">Reanudar</button>
            <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
            <button id="controls-toggle-btn" class="menu-btn menu-btn--secondary">Ver controles</button>
            <div id="pause-controls" class="pause-controls hidden">
              <ul>
                <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> mover</li>
                <li><kbd>&uarr;</kbd> rotar</li>
                <li><kbd>&darr;</kbd> bajar</li>
                <li><kbd>Space</kbd> ca&iacute;da</li>
                <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
              </ul>
            </div>
            <div class="level-selector">
              <span class="level-label">Nivel inicial</span>
              <div class="level-picker">
                <button id="level-down" class="level-btn" type="button">&minus;</button>
                <span id="start-level-display">1</span>
                <button id="level-up" class="level-btn" type="button">+</button>
              </div>
            </div>
          </div>

          <!-- Game over content -->
          <div id="gameover-content" class="overlay-content hidden">
            <p id="overlay-title" class="overlay-heading overlay-heading--danger">GAME OVER</p>
            <p id="overlay-score"></p>
            <button id="restart-btn" class="menu-btn">Reiniciar</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
