<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
      <span id="theme-label">OSCURO</span><span class="switch"></span>
    </button>
    <h1 class="title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>

          <div id="name-input-section" class="name-input-section hidden">
            <label for="player-name" class="name-label">Nuevo r&eacute;cord! Tu nombre:</label>
            <div class="name-row">
              <input type="text" id="player-name" maxlength="12" placeholder="Jugador" autocomplete="off" />
              <button id="save-score-btn">Guardar</button>
            </div>
          </div>

          <div id="scores-table-container" class="scores-table-container hidden">
            <p class="scores-title">MEJORES PUNTUACIONES</p>
            <table id="scores-table" class="scores-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Nombre</th>
                  <th>Puntuaci&oacute;n</th>
                  <th>L&iacute;neas</th>
                  <th>Mejor combo</th>
                </tr>
              </thead>
              <tbody id="scores-tbody"></tbody>
            </table>
            <button id="clear-scores-btn" class="clear-scores-btn">Borrar r&eacute;cords</button>
          </div>

          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
